<html>
    <head>
        <link rel="stylesheet" href="./index.css">
    </head>

    <body>
        <div id="container">
            <div id="mem-pane">
                <table id="mem"></table>
            </div>

            <div id="control-pane">
                <button id="load">LOAD</button>
                <button id="step">STEP</button>
                <button id="run">RUN</button>
                <button id="stop">STOP</button>

                <input type="checkbox" id="sense-p">
                <label for="sense-p">Sense P</label>

                <input type="checkbox" id="sense-q">
                <label for="sense-q">Sense Q</label>

                <br>
                <input type="range" id="speedFactorSlider" min="0" value="0">
                <span id="speedFactor">1</span>
            </div>

            <div id="printer-pane">
                <h3>Printer</h3>
                <td><table id="printer"></table></td>
            </div>

            <div id="registers"></div>

            <div id="io-toggles">
                <div>
                    <form id="io-upper-pane-selector">
                        <input type="radio" id="tape-l-top-selector" name="io-upper" value="tape-J" checked="checked"/>
                        <label for="tape-l-top-selector">Tape J</label>
                    
                        <input type="radio" id="tape-l-top-selector" name="io-upper" value="tape-K" />
                        <label for="tape-l-top-selector">Tape K</label>

                        <input type="radio" id="tape-l-top-selector" name="io-upper" value="tape-L" />
                        <label for="tape-l-top-selector">Tape L</label>

                        <input type="radio" id="tape-m-top-selector" name="io-upper" value="tape-M" />
                        <label for="tape-m-top-selector">Tape M</label>

                        <input type="radio" id="drum-P-top-selector" name="io-upper" value="drum-P" />
                        <label for="drum-P-top-selector">Drum P</label>

                        <input type="radio" id="drum-q-top-selector" name="io-upper" value="drum-Q" />
                        <label for="drum-q-top-selector">Drum Q</label>
                    </form>
                  </div>

                  <div>
                    <form id="io-lower-pane-selector">
                        <input type="radio" id="tape-l-top-selector" name="io-lower" value="tape-J" />
                        <label for="tape-l-top-selector">Tape J</label>
                    
                        <input type="radio" id="tape-l-top-selector" name="io-lower" value="tape-K" checked="checked"/>
                        <label for="tape-l-top-selector">Tape K</label>

                        <input type="radio" id="tape-l-top-selector" name="io-lower" value="tape-L" />
                        <label for="tape-l-top-selector">Tape L</label>

                        <input type="radio" id="tape-m-top-selector" name="io-lower" value="tape-M" />
                        <label for="tape-m-top-selector">Tape M</label>

                        <input type="radio" id="drum-P-top-selector" name="io-lower" value="drum-P" />
                        <label for="drum-P-top-selector">Drum P</label>

                        <input type="radio" id="drum-q-top-selector" name="io-lower" value="drum-Q" />
                        <label for="drum-q-top-selector">Drum Q</label>
                    </form>
                  </div>
            </div>

            <div id="tape-J-pane" class="io-pane">
                <h3>Tape J</h3>
                <table class='tape' id='tape-J'></table>
            </div>
            
            <div id="tape-K-pane" class="io-pane">
                <h3>Tape K</h3>
                <table class='tape' id='tape-K'></table>
            </div>

            <div id="tape-L-pane" class="io-pane">
                <h3>Tape L</h3>
                <table class='tape' id='tape-L'></table>
            </div>

            <div id="tape-M-pane" class="io-pane">
                <h3>Tape M</h3>
                <table class='tape' id='tape-M'></table>
            </div>

            <div id="drum-P-pane" class="io-pane">
                <h3>Drum P</h3>
                <table class='tape' id='drum-P'></table>
            </div>

            <div id="drum-Q-pane" class="io-pane">
                <h3>Drum Q</h3>
                <table class='tape' id='drum-Q'></table>
            </div>

            <div id="code-pane">
                <textarea id="code"><load src="matrix.spc"/></textarea>
            </div>
        </div>
        <script type="module" src="/src/web-entry.ts"></script>
    </body>
</html>
