<html>
    <head>
        <link rel="stylesheet" href="./index.css">
    </head>

    <body>
        <div id="container">
            <div id="mem-pane">
                <table id="mem"></table>
            </div>

            <div id="control-pane">
                <button id="load">LOAD</button>
                <button id="step">STEP</button>
                <button id="run">RUN</button>
                <button id="stop">STOP</button>

                <label for="op-delay">Op Delay</label>
                <input id="op-delay" type="number" value="50"/>
            </div>

            <div id="printer-pane">
                <h3>Printer</h3>
                <td><table id="printer"></table></td>
            </div>

            <div id="registers"></div>

            <div id="tape-J-pane">
                <h3>Tape J</h3>
                <table class='tape' id='tape-J'></table>
            </div>
            <div id="tape-K-pane">
                <h3>Tape K</h3>
                <table class='tape' id='tape-K'></table>
            </div>

            <div id="code-pane">
                <textarea id="code"><load src="matrix.spc"/></textarea>
            </div>
        </div>
        <script type="module" src="/src/web-entry.ts"></script>
    </body>
</html>
